name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test JDK ${{ matrix.jdk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # , windows-latest, macos-latest
        jdk: ['8', '11'] # , '17', '21', '23'
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'zulu'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          .m2/repository
        key: ${{ runner.os }}-maven-${{ matrix.jdk }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ matrix.jdk }}-
          ${{ runner.os }}-maven-

    - name: Run tests
      run: mvn clean verify -B
      timeout-minutes: 30

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Preparation steps
      uses: ./.github/actions/common-steps

    - name: Run quality checks
      run: mvn clean compile checkstyle:check spotbugs:check -B
      continue-on-error: true

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: |
          ./**/checkstyle-result.xml
          ./**/spotbugsXml.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Preparation steps
      uses: ./.github/actions/common-steps

    - name: Run OWASP dependency check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DskipProvidedScope=true
      continue-on-error: true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: ./**/dependency-check-report.html

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Preparation steps
      uses: ./.github/actions/common-steps

    - name: Build all artifacts
      run: mvn clean package -DskipTests -B

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fop-artifacts
        path: |
          fop/*/*.jar
          fop-core/*/*.jar
          fop-events/*/*.jar
          fop-sandbox/*/*.jar
          fop-servlet/*/*.jar
          fop-transcoder/*/*.jar
          fop-transcoder-allinone/*/*.jar
          fop-util/*/*.jar
          target/*.pom